name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: pip install fonttools==4.55.8

      - name: Build
        run: make all

      # Publication gate: no variable fonts, legacy family names intact,
      # Regular+Bold present per required family (see test/mn2pdf_compat.py).
      # A release that fails this breaks metanorma PDF renders (v1.3 did).
      - name: mn2pdf compatibility checks
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: source-fonts
          path: source-fonts.zip
          retention-days: 1

  fop-render:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: source-fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Apache FOP is the PDF engine inside mn2pdf; rendering every
      # required family at Regular and Bold through it is the
      # end-to-end form of "we cannot break mn2pdf".
      - name: Install Apache FOP
        run: |
          curl -ssL -o /tmp/fop.tar.gz https://archive.apache.org/dist/xmlgraphics/fop/binaries/fop-2.9-bin.tar.gz
          tar -xzf /tmp/fop.tar.gz -C /tmp

      - name: Render required families through FOP
        run: |
          unzip -q source-fonts.zip -d .
          /tmp/fop-2.9/fop/fop -c test/fop.xconf -fo test/render.fo -pdf out.pdf
          test -s out.pdf
          for name in SourceHanSans SourceSansPro SourceSerifPro SourceCodePro; do
            grep -aq "$name" out.pdf || { echo "PDF does not embed $name"; exit 1; }
          done

      - name: Upload failed render
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fop-render-failure
          path: out.pdf
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, fop-render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-fonts

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Rename artifact
        run: mv source-fonts.zip source-fonts-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          body: Automatic release of ${{ github.ref }}
          files: source-fonts-*.zip
